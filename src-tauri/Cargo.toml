[package]
name = "termul-manager"
version = "0.4.8"
description = "Project-aware terminal that treats workspaces as first-class citizens"
authors = ["gnoviawan", "mannnrachman (Tauri port)"]
edition = "2021"
# ACP 0.12.1 (vendored) is edition 2024 and requires Rust ≥ 1.85; bump MSRV to match.
rust-version = "1.85"
# Two binaries live in this crate: the desktop app (`termul-manager`, the
# implicit src/main.rs) and the standalone headless server (`termul-server`).
# Pin `cargo run` / `tauri dev` to the desktop app so Cargo doesn't error on
# ambiguity. The standalone binary is built explicitly via
# `cargo build --bin termul-server --features standalone-server`.
default-run = "termul-manager"

[lib]
name = "termul_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Standalone headless server (Story 1.2). Gated so default `cargo build` / `tauri
# build` do NOT build or bundle it (Tauri bundler copies every [[bin]] it
# discovers — see tauri#15325). Source lives OUTSIDE `src/bin/` so stage-2
# disk scan cannot re-add it. Build with:
#   cargo build --bin termul-server --features standalone-server
[[bin]]
name = "termul-server"
path = "src/server_main.rs"
required-features = ["standalone-server"]

[features]
default = []
# Enables the termul-server binary entry. rust-embed is now always-on (the
# desktop's in-process shared-live server serves the SAME embedded bundle in a
# release install without dist-web/ on disk).
standalone-server = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable is required for child/multi-webview support used by BrowserTabManager
tauri = { version = "2.0", features = ["unstable", "devtools", "tray-icon"] }
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-mcp-bridge = "0.9"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# ADR-004.6: opt-in, read-only fetch of the ACP Registry (identity/discovery
# only). rustls-tls matches the backend already pulled in by the updater plugin.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

# ACP registry binary install (zip / tar.gz archives)
zip = "2"
tar = "0.4"
flate2 = "1"

# PTY and async runtime
portable-pty = "0.9"
anyhow = "1"
tokio = { version = "1", features = ["full", "test-util"] }
parking_lot = "0.12"
futures = "0.3"
futures-concurrency = "7"
async-process = "2"

# ACP (Agent Client Protocol) — ADR-003 P0
# NOTE: agent-client-protocol 0.12 ships its own `AcpAgent`/`Stdio` transport
# (built on async-process), so the separate `agent-client-protocol-tokio` crate
# is NOT used — it depends on acp 0.11, which would pull a second, incompatible
# copy of the protocol crate into the tree. See Spec Change Log in
# spec-adr-003-p0-rust-acp-core.md.
agent-client-protocol = { version = "0.12", features = ["unstable_session_model", "unstable_session_usage"] }

# MCP client probe (on-demand `initialize` + `tools/list`). rmcp is already in
# the dep tree transitively via the vendored ACP (which enables `server` +
# `transport-io`); this direct dep adds the CLIENT transport features Termul's
# own probe needs. Resolved to 1.7.0 from `^1.2.0`. The `client-side-sse`
# feature is rmcp's SSE stream parser (consumed by the streamable-http client);
# rmcp 1.7.0 removed the standalone legacy SSE transport (CHANGELOG #562), so
# `type: 'sse'` servers are probed via the modern streamable-http client (which
# still speaks `text/event-stream`). See `src/acp/mcp_probe.rs`.
rmcp = { version = "1.2.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "client-side-sse",
] }

# Regex and parsing
regex = "1"
lazy_static = "1.4"

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# SSH linkage is selected per target below: macOS vendors OpenSSL for portable
# app bundles, while Windows/Linux retain the system/default behavior.

# Secure storage (OS keychain for secure credential storage).
# IMPORTANT: keyring selects its backend at COMPILE TIME via cargo features.
# Without an OS-backend feature it silently falls back to an in-memory mock
# store, so set_password "succeeds" but get_password always returns NoEntry
# (credentials never persist). Enable the native backend per OS below.
keyring = "3.6"

# Logging
log = "0.4"

# Remote terminal server (embedded Axum HTTP + WebSocket)
# Reuses the existing tokio + hyper 1.x + tower stack already in the dep tree.
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Cryptographic random generation for auth tokens
getrandom = "0.2"

# Structured logging for remote server
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false }

# Embed the Vite web bundle (dist-web/) into the binary so the standalone
# termul-server AND the desktop's in-process shared-live server serve the web
# client without dist-web/ on disk. #[allow_missing] keeps dev/CI-compile
# green when the bundle is absent; the release build fails clearly via
# build.rs when it is missing.
rust-embed = { version = "8.12", features = ["mime-guess"] }

[dev-dependencies]
tauri = { version = "2.0", features = ["test"] }
tower = { version = "0.5", features = ["util"] }

# --- OS keychain backends for `keyring` (see note on the keyring dep above) ---
# Windows Credential Manager
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# macOS Keychain and self-contained SSH/OpenSSL linkage for packaged apps
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# Preserve the existing system/default SSH native dependency behavior outside
# macOS. Global vendoring breaks common Windows/MSYS development environments.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ssh2 = "0.9"

# Linux Secret Service (persistent across reboots) with pure-Rust crypto so we
# don't require a system OpenSSL/Perl build toolchain.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winapi = { version = "0.3", features = [
    "jobapi2",
    "winbase",
    "winuser",
    "consoleapi",
    "handleapi",
    "processenv",
    "processthreadsapi",
    "synchapi",
    "minwindef",
    "winnt",
    "namedpipeapi",
    "wincontypes",
    "ntdef",
] }

# Termul patch: vendored copy of agent-client-protocol 0.12.1 with one change —
# spawn_process sets CREATE_NO_WINDOW on Windows so ACP agent subprocesses do
# not flash a console window. See vendor/agent-client-protocol/src/acp_agent.rs.
# Keep the `= "0.12"` requirement above; this only redirects where it resolves.
[patch.crates-io]
agent-client-protocol = { path = "vendor/agent-client-protocol" }





