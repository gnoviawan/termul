# Force async-process's SIGCHLD reaper on Unix.
#
# This copy covers `cd src-tauri && cargo …` and `tauri build` (the CLI
# chdirs here before invoking Cargo). Builds whose cwd is the repo root
# (`cargo build --manifest-path src-tauri/Cargo.toml`) do not walk into this
# directory; they need the same flag in the repo-root `.cargo/config.toml`.
# Both files must stay in sync. See that file for why the pidfd backend
# busy-loops the agent thread.
#
# Windows must not see the cfg: the signal backend is not compiled there and
# spawning panics ("neither the signal backend nor the waiter backend is
# available").
[target.'cfg(not(target_os = "windows"))']
rustflags = ["--cfg", "async_process_force_signal_backend"]
