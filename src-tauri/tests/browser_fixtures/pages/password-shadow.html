<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow password fixture</title>
</head>
<body>
<main>
<h1>Shadow password fixture</h1>
<x-login id="login"></x-login>
</main>
<script>
var root = document.getElementById('login').attachShadow({ mode: 'open' });
root.innerHTML =
  '<form action="/form-done.html" method="get">' +
  '<input name="secret" type="password" aria-label="Password">' +
  '<button id="go" type="submit">Sign in</button></form>';
root.getElementById('go').focus();
</script>
</body>
</html>
