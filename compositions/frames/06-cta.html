<template data-composition-id="06-cta">
  <style>
    .scene {
      position: absolute;
      inset: 0;
      background: #FAF9F5;
      container-type: size;
      overflow: hidden;
    }
    
    .safe-area {
      position: absolute;
      inset: 0 0 184px 0; /* Caption keep-out 17% */
    }
    
    .bg-glow {
      position: absolute;
      inset: -400px;
      background: radial-gradient(circle, rgba(204,120,92,0.15) 0%, rgba(204,120,92,0) 60%);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }
    
    .kbs-wrapper, .hero-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .kbs-wrapper {
      gap: 3.5cqw;
    }
    
    .kicker-spike {
      font-family: "JetBrains Mono", monospace;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #141413;
      display: flex;
      align-items: center;
      gap: 8px;
      will-change: transform, opacity;
    }
    
    .kicker-spike .coral {
      color: #CC785C;
    }
    
    .kbs-stage {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1.7cqw;
      will-change: transform, opacity;
    }
    
    .kbs-line {
      font-family: "EB Garamond", serif;
      font-size: 7.3cqw;
      font-weight: 400;
      line-height: 1.02;
      letter-spacing: -0.022em;
      color: #141413;
      will-change: transform, filter, opacity;
    }
    
    .hero-container {
      gap: 2.5cqw;
      will-change: opacity;
    }
    
    .logo {
      width: 32cqw;
      height: auto;
      max-height: 24cqh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(20,20,19,0.12);
      box-shadow: 0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04);
      will-change: transform, opacity;
      background: #FAF9F5;
    }
    
    .btn-wrapper {
      position: relative;
      display: grid;
      place-items: center;
      will-change: transform, opacity;
    }
    
    .burst {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(204,120,92,1) 0%, rgba(204,120,92,0) 70%);
      filter: blur(40px);
      opacity: 0;
      transform: scale(1);
      pointer-events: none;
      will-change: transform, opacity;
    }
    
    .btn {
      position: relative;
      z-index: 2;
      padding: 1.4cqw 2.8cqw;
      background: #CC785C;
      border: none;
      border-radius: 8px;
      font-family: "Inter", sans-serif;
      font-size: 1.46cqw;
      font-weight: 500;
      line-height: 1.0;
      color: #FAF9F5;
      transform-origin: 50% 50%;
      box-shadow: 0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04);
      will-change: transform, box-shadow, opacity;
    }
  </style>

  <div class="scene">
    <div class="bg-glow" id="bg-glow"></div>
    
    <div class="safe-area">
      <div class="kbs-wrapper" id="kbs-wrapper">
        <div class="kicker-spike" id="kicker"><span class="coral">✱</span> Termul</div>
        
        <div class="kbs-stage" id="kbs-stage">
          <div class="kbs-line" id="p1">Take</div>
          <div class="kbs-line" id="p2">control.</div>
        </div>
      </div>

      <div class="hero-container" id="hero-container">
        <img src="assets/termul.png" class="logo" id="logo" alt="Termul Manager">
        <div class="btn-wrapper" id="btn-wrapper">
          <div class="burst" id="burst"></div>
          <button class="btn" id="btn">Download Termul</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Initial hidden states
    gsap.set(["#kicker", "#p1", "#p2", "#logo", "#btn-wrapper"], { opacity: 0 });

    const PULSE = 0.4;
    const BEATS = [PULSE * 1, PULSE * 2]; // 0.4, 0.8

    // Kicker entrance
    tl.fromTo("#kicker",
      { y: 16, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
      0.2
    );

    // p1: hard slam
    tl.fromTo("#p1",
      { scale: 1.5, filter: "blur(12px)", opacity: 0 },
      { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
      BEATS[0]
    );

    // p2: side snap
    tl.fromTo("#p2",
      { x: -60, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
      BEATS[1]
    );

    // Climax starts at 1.85s (after ~0.6s hold from 1.25s)
    const CLIMAX_START = 1.85;

    // Shift text up slightly and fade out to make logo/btn the primary focal points
    tl.to("#kbs-wrapper", 
      { y: -20, opacity: 0, duration: 0.4, ease: "power2.inOut" },
      CLIMAX_START
    );

    // Hero image (logo/screenshot) fade in
    const LOGO_START = CLIMAX_START + 0.1; // 1.95s
    tl.fromTo("#logo",
      { y: 30, opacity: 0, scale: 0.98 },
      { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" },
      LOGO_START
    );
    
    // Button fade in
    tl.fromTo("#btn-wrapper",
      { y: 20, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
      LOGO_START + 0.2 // 2.15s
    );

    // Press release spring on the download button
    const PRESS_START = 2.8;
    const PRESS_DUR = 0.15;
    const RELEASE_START = PRESS_START + PRESS_DUR; // 2.95s
    const PRESS_SCALE = 0.92;
    const BOUNCE_FACTOR = 2.0;

    // Press (linear)
    tl.to("#btn",
      { 
        scale: PRESS_SCALE, 
        boxShadow: "0 1px 2px rgba(20,20,19,0.12), 0 2px 8px rgba(20,20,19,0.08)",
        duration: PRESS_DUR, 
        ease: "power1.in" 
      },
      PRESS_START
    );

    // Release (spring)
    tl.to("#btn",
      { 
        scale: 1, 
        boxShadow: "0 1px 3px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.04)",
        duration: 0.6, 
        ease: `back.out(${BOUNCE_FACTOR})` 
      },
      RELEASE_START
    );

    // Burst glow
    tl.fromTo("#burst",
      { scale: 1, opacity: 0 },
      { scale: 5, opacity: 0.8, duration: 0.5, ease: "power2.out" },
      RELEASE_START
    );
    tl.to("#burst", { opacity: 0, duration: 0.5, ease: "power2.in" }, RELEASE_START + 0.4);

    // Background glow
    tl.to("#bg-glow",
      { opacity: 0.35, duration: 0.8, ease: "power2.out" },
      RELEASE_START
    );

    // Sine wave loop on the logo
    // Starts exactly after logo settles (LOGO_START + 0.8 = 2.75)
    const IDLE_START = 2.75;
    const TOTAL_DURATION = 5.0;
    const IDLE_DUR = TOTAL_DURATION - IDLE_START; // 2.25s
    const CYCLES = IDLE_DUR / 2.5; // ~0.9 cycles
    
    const phase = { p: 0 };
    tl.to(phase, {
      p: Math.PI * 2 * CYCLES,
      duration: IDLE_DUR,
      ease: "none",
      onUpdate: () => {
        const scale = 1 + Math.sin(phase.p) * 0.01;
        const y = Math.sin(phase.p) * 3;
        document.getElementById("logo").style.transform = `translateY(${y}px) scale(${scale})`;
      }
    }, IDLE_START);

    window.__timelines["06-cta"] = tl;
  </script>
</template>
