<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Story 5.3 (AC1): `interactive-widget=resizes-content` opts Chromium/Android
         (Chrome 108+) into resizing the layout viewport when the on-screen
         keyboard shows. iOS Safari ignores this key — the `useOskViewport`
         hook covers iOS via `window.visualViewport` resize+scroll events. -->
    <!-- Story 7 (QA F2): `viewport-fit=cover` extends the webview into the
         notch/home-indicator zone so `env(safe-area-inset-*)` resolves to the
         real device insets instead of 0; without it every inset usage in the
         mobile shell (shell top padding, git-sheet bottom inset, key bar) is
         a no-op on cutout devices. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Termul Manager - Project-Aware Terminal</title>
    <meta name="description" content="Termul Manager is a project-aware terminal that treats workspaces as first-class citizens with persistent memory, visual identity, and intelligent organization." />
    <meta name="author" content="Termul Manager" />
    <meta name="theme-color" content="#1E1E1E" />

    <!-- PWA surface (web client only — tauri-index.html deliberately has none
         of this; the desktop webview never registers a service worker).
         manifest + icons enable the browser-native install flow; the apple-*
         meta tags cover iOS Add-to-Home-Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <!-- apple-touch-icon must be opaque — iOS composites transparency on black -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Termul" />

    <meta property="og:title" content="Termul Manager - Project-Aware Terminal" />
    <meta property="og:description" content="The first terminal that treats projects as the organizing principle. Switch projects, get your context instantly." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/pwa-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@termulmanager" />
    <meta name="twitter:image" content="/icons/pwa-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
