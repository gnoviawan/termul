name: Docker Image

on:
  pull_request:
    branches: [main, develop, dev]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - src-tauri/tauri.conf.json
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Image (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TERMUL_IMAGE: troupe-server:ci
      BASE_URL: http://127.0.0.1:8080
      TOKEN_FILE: /home/termul/.local/state/termul/web-auth-token
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The nightly release is the newest published build of dev. The runner's
      # UID owns the workspace bind mount, so the image user takes that UID.
      - name: Build image from the nightly release
        run: |
          docker build \
            --build-arg TERMUL_RELEASE=nightly \
            --build-arg TERMUL_UID="$(id -u)" \
            --build-arg TERMUL_GID="$(id -g)" \
            --tag "$TERMUL_IMAGE" .

      - name: Check the binary answers under both names
        run: |
          set -euo pipefail
          for bin in troupe-server termul-server; do
            docker run --rm --entrypoint "/usr/local/bin/$bin" "$TERMUL_IMAGE" --help > /dev/null
          done
          test "$(docker run --rm --entrypoint readlink "$TERMUL_IMAGE" /usr/local/bin/termul-server)" = troupe-server

      - name: Start the compose stack
        run: |
          mkdir -p workspace
          docker compose up -d --no-build --pull never --wait --wait-timeout 120

      - name: Check user, auth gate, remote writes, and token secrecy
        run: |
          set -euo pipefail
          container_uid="$(docker compose exec -T termul-server id -u)"
          test "$container_uid" = "$(id -u)"
          test "$container_uid" != 0
          docker compose exec -T termul-server sh -c \
            'touch "$HOME/.local/bin/.probe" /tmp/.probe && ! touch /.probe 2>/dev/null'

          curl -fsS "$BASE_URL/health"
          echo
          status="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/projects")"
          test "$status" = 401

          token="$(docker compose exec -T termul-server cat "$TOKEN_FILE")"
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" -H 'Content-Type: application/json' \
            -d '{"id":"ci","name":"ci","path":"/workspace","color":"blue"}' \
            "$BASE_URL/projects" | jq -e '.success == true'
          curl -fsS -H "$auth" -H 'Content-Type: application/json' \
            -d '{"path":"/workspace/created-by-ci"}' \
            "$BASE_URL/fs/mkdir" | jq -e '.success == true'
          test -d workspace/created-by-ci

          if docker compose logs termul-server | grep -qF "$token"; then
            echo "The server printed the auth token." >&2
            exit 1
          fi

      - name: Check that state survives container recreation
        run: |
          set -euo pipefail
          before="$(docker compose exec -T termul-server sha256sum "$TOKEN_FILE")"
          docker compose down
          docker compose up -d --no-build --pull never --wait --wait-timeout 120
          after="$(docker compose exec -T termul-server sha256sum "$TOKEN_FILE")"
          test "$before" = "$after"
          token="$(docker compose exec -T termul-server cat "$TOKEN_FILE")"
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Bearer $token" "$BASE_URL/projects" \
            | jq -e '.data.projects | any(.id == "ci")'

      - name: Show server logs
        if: failure()
        run: docker compose logs termul-server

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes
