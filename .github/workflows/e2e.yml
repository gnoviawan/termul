name: E2E

# Runs the Playwright suite in tests/e2e. It drives a release `termul-server`
# and the built web client against a fake ACP agent (tests/e2e/fake-longrun-agent.ts),
# so it covers spawn, prompt streaming, permissions, elicitations, crash
# recovery and reconnect without a network LLM or credentials.
#
# It runs the ACP lifecycle specs (agent-survival, crash-recovery, elicitation,
# switch-responsiveness, web-reopen-live-turn-tool-cards) on pull requests that
# change ACP, relay or e2e files, and daily for every other change. Dispatch it by
# hand with a `specs` input to run other specs. The mobile layout specs fail on
# CI today and stay out of the default list (issue #1343).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev]
    paths:
      - '.github/workflows/e2e.yml'
      - 'tests/e2e/**'
      - 'src-tauri/src/acp/**'
      - 'src-tauri/src/web/**'
      - 'src/shared/types/web-protocol.types.ts'
      - 'src/renderer/lib/acp-*'
      - 'src/renderer/lib/acp-transport/**'
      - 'src/renderer/stores/acp-store/**'
      - 'src/renderer/stores/acp-store.ts'
      - 'src/renderer/components/chat/**'
      - 'src-tauri/src/server_main.rs'
      - 'src-tauri/build.rs'
      - 'canvas/figcraft.pin'
      - 'scripts/canvas/**'
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      specs:
        description: 'Playwright file filters, space separated. ".spec" runs every spec.'
        default: 'agent-survival crash-recovery elicitation switch-responsiveness web-reopen-live-turn-tool-cards composer-at-menu'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (termul-server)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # The web bundle must exist before the release build so rust-embed
      # embeds it, and tests/e2e/global-setup.ts refuses to start without it.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      # A release build without the figcraft canvas bundle fails to compile
      # (canvas_bundle_missing in src-tauri/build.rs), so fetch it as
      # release.yml does.
      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Build termul-server (release)
        working-directory: src-tauri
        run: cargo build --release --bin termul-server --features standalone-server

      - name: Install Playwright Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          E2E_SPECS: ${{ inputs.specs || 'agent-survival crash-recovery elicitation switch-responsiveness web-reopen-live-turn-tool-cards composer-at-menu subagent-history' }}
          # These seven tests fail on dev for reasons outside the harness. In four of
          # them a project switch opens the Project Settings dialog, which then
          # covers the New chat button. The other three fail or flake on chat tab and
          # tool card assertions. Tracked in https://github.com/gnoviawan/termul/issues/1343.
          # Remove a title from this list when its test is fixed.
          E2E_KNOWN_RED: 'closing a chat mid-turn only detaches it|tab switching mid-run: another chat tab|project switching mid-run|three projects run concurrently|browser reload with a crashed chat open|project switch round-trips the streaming chat tab|reload mid-turn: the reopened chat shows the tool cards'
        # Playwright reads each word of E2E_SPECS as a file filter. `set -f` stops the
        # shell from expanding a glob in a manual filter.
        run: |
          set -f
          bun run test:e2e $E2E_SPECS --grep-invert "$E2E_KNOWN_RED"

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: e2e-playwright-output
          path: tests/e2e/.playwright-out/
          # Playwright writes to a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
