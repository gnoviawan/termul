name: Deploy Landing

# The landing project also serves the docs under /docs, so docs changes
# redeploy it too.
on:
  push:
    branches: [main, dev]
    paths:
      - 'landing/**'
      - 'website-docs/**'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - 'website-docs/**'
      - '.github/workflows/deploy-landing.yml'
  # release.yml dispatches deploy-docs after each stable release; dispatch this
  # too once the docs domain points here.
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: landing

      - name: Build
        run: bun run build
        working-directory: landing

      - name: Verify prerender
        run: bun run verify:prerender
        working-directory: landing

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: website-docs

      - name: Fetch the API spec from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        # Same as deploy-docs.yml: releases before the spec shipped have no
        # openapi.yaml, and the API reference page then says so.
        run: |
          assets=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if ! grep -qxF openapi.yaml <<<"$assets"; then
            echo "::notice::The latest release has no openapi.yaml yet"
            exit 0
          fi
          gh release download --repo "$GITHUB_REPOSITORY" --pattern openapi.yaml \
            --dir website-docs/public --clobber

      - name: Build docs
        run: bun run build
        working-directory: website-docs

      # website-docs/build/client/docs is the whole docs site as served under
      # /docs; its 404.html answers unknown /docs/* URLs. The standalone docs
      # project's _redirects stays behind in build/client.
      - name: Add docs under /docs
        run: |
          if [ -e landing/dist/docs ]; then
            echo "::error::landing/dist/docs already exists; the landing build must not own /docs"
            exit 1
          fi
          cp -R website-docs/build/client/docs landing/dist/docs
          test -f landing/dist/docs/index.html
          test -f landing/dist/docs/404.html

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          command: pages deploy dist --project-name=termul-landing --branch=${{ github.ref_name == 'main' && 'main' || github.head_ref || github.ref_name }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
