name: Canvas smoke

# Real-Chrome smoke for the design-system canvas (design-system/smoke). It starts
# the canvas Vite dev server, loads every registry entry, and checks console
# errors, rendered previews, and the accessible names Chrome computes for every
# button. No Rust build, server, or credentials.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev, design-system-canvas]
    paths:
      - '.github/workflows/canvas-smoke.yml'
      - 'design-system/**'
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'vite.config.web.ts'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canvas-smoke:
    name: Playwright canvas smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run canvas smoke
        run: bun run test:smoke:canvas

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: canvas-smoke-playwright-output
          path: design-system/smoke/.playwright-out/
          # Playwright writes to a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
