name: Browser Conformance

# Proves browser automation on each OS's real webview engine: clippy with
# warnings denied, the full Rust test suite, then the conformance runner
# (`src-tauri/tests/browser_conformance`). Capabilities that fail today are
# recorded per OS in `src-tauri/tests/browser_conformance/expected/`. Any
# result that differs from that record fails the job.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev]
    paths:
      - "src-tauri/**"
      - ".github/workflows/browser-conformance.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: browser-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Clippy, tests and conformance (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    # A cold Windows build compiles the whole Tauri stack twice (check and
    # test profiles), then the post-job cache save adds minutes.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # rust-embed embeds dist-web/ at build time, and the web::assets tests
      # assert on the embedded bundle.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build tests (Windows adds the Common-Controls manifest)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: ./tests/browser_conformance/build-windows-tests.ps1

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Browser conformance
        working-directory: src-tauri
        shell: bash
        env:
          TERMUL_BROWSER_CONFORMANCE: "1"
          TERMUL_BROWSER_CONFORMANCE_OUT: ${{ runner.temp }}/browser-conformance.json
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1600x1000x24" cargo test --test browser_conformance -- --nocapture
          else
            cargo test --test browser_conformance -- --nocapture
          fi

      - name: Upload conformance summary
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: browser-conformance-${{ matrix.name }}
          path: ${{ runner.temp }}/browser-conformance.json
          if-no-files-found: warn
          retention-days: 14
