name: Publish Container Image

on:
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag whose troupe-server assets go into the image (v0.5.0, nightly)
        required: true
        type: string
      image_tags:
        description: Newline-separated tags to push to ghcr.io/<owner>/troupe-server and the legacy ghcr.io/<owner>/termul-server
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build and push linux/amd64 and linux/arm64
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          IMAGE_TAGS: ${{ inputs.image_tags }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # One build pushed under both names, so existing pulls of
          # termul-server get the same digest as troupe-server.
          images=("ghcr.io/${OWNER,,}/troupe-server" "ghcr.io/${OWNER,,}/termul-server")
          tags=()
          # Docker tags cannot contain "+", so SemVer build metadata becomes "-".
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              for image in "${images[@]}"; do
                tags+=(--tag "$image:${tag//+/-}")
              done
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg TERMUL_RELEASE="$RELEASE_TAG" \
            "${tags[@]}" \
            --provenance=mode=max \
            --sbom=true \
            --push \
            .
